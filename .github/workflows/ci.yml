name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm security:audit

      - name: Materialize verified region data
        env:
          REGION_DATA_BASE_URL: ${{ vars.REGION_DATA_BASE_URL }}
        run: node scripts/sync-region-data.mjs --groups region-dist,region-db --prune

      - name: Check formatting
        run: pnpm format:check

      - name: Check maintained source size
        run: pnpm code:size-check

      - name: Check API runtime pins
        run: pnpm runtime:check-pins

      - name: Test operational scripts
        run: pnpm scripts:test

      - name: Test geoint package
        run: pnpm --filter @ground-codes/geoint test

      - name: Audit URL label data
        run: pnpm data:audit-labels

      - name: Report URL label data
        run: pnpm data:report-labels

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Test core package
        run: pnpm --filter ground-codes test

      - name: Test standalone package
        run: pnpm --filter ground-codes test:standalone

      - name: Test API
        run: pnpm --filter api-ground-codes test

      - name: Test web client
        run: pnpm --filter web test

      - name: Enforce coverage policy
        run: pnpm coverage

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm --filter web test:e2e:smoke
