name: Visual QA

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize verified region data
        env:
          REGION_DATA_BASE_URL: ${{ vars.REGION_DATA_BASE_URL }}
        run: node scripts/sync-region-data.mjs --groups region-dist,region-db --prune

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run mobile layout gate
        run: pnpm --filter web test:e2e:layout

      - name: Capture visual QA screenshots
        run: pnpm --filter web qa:visual

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-qa-screenshots
          path: apps/web/test-results
          if-no-files-found: error
